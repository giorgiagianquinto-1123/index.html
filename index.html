<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Earnings Tracker Pro</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 2rem; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h1 { color: #2ecc71; font-size: 3.2rem; margin: 10px 0; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
        label { display: block; text-align: left; font-size: 0.85rem; font-weight: 600; color: #444; margin-top: 15px; }
        input { width: 100%; padding: 14px; margin: 5px 0; border: 2px solid #eee; border-radius: 12px; box-sizing: border-box; font-size: 1rem; transition: border-color 0.3s; }
        input:focus { border-color: #2ecc71; outline: none; }
        button { background: #2ecc71; color: white; border: none; padding: 16px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; font-size: 1.1rem; margin-top: 20px; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        .reset-btn { background: #e74c3c; margin-top: 15px; font-size: 0.9rem; }
        .stats { font-size: 1rem; color: #7f8c8d; font-weight: 500; }
        .info-box { background: #f8f9fa; padding: 15px; border-radius: 12px; margin-top: 15px; text-align: left; font-size: 0.85rem; color: #2c3e50; }
    </style>
</head>
<body>

    <div class="card" id="setup">
        <h2 style="margin-top:0">Configurazione</h2>
        <label>Paga Giornaliera (€)</label>
        <input type="number" id="pagaGiorno" placeholder="Es: 120" step="0.01">
        
        <label>Inizio Periodo</label>
        <input type="datetime-local" id="dataInizio">
        
        <label>Fine Periodo</label>
        <input type="datetime-local" id="dataFine">
        
        <button onclick="startCounter()">Avvia Conteggio</button>
    </div>

    <div class="card" id="counter" style="display:none;">
        <div class="stats">Guadagno in tempo reale:</div>
        <h1 id="display">€ 0,0000</h1>
        
        <div class="info-box" id="summary">
            </div>
        
        <button class="reset-btn" onclick="clearData()">Ferma e Reset</button>
    </div>

    <script>
        // Al caricamento, controlla se ci sono dati salvati
        window.onload = function() {
            if(localStorage.getItem('pagaGiorno')) {
                document.getElementById('pagaGiorno').value = localStorage.getItem('pagaGiorno');
                document.getElementById('dataInizio').value = localStorage.getItem('dataInizio');
                document.getElementById('dataFine').value = localStorage.getItem('dataFine');
            }
        }

        function startCounter() {
            const pagaG = parseFloat(document.getElementById('pagaGiorno').value);
            const inizio = new Date(document.getElementById('dataInizio').value);
            const fine = new Date(document.getElementById('dataFine').value);

            if (!pagaG || isNaN(inizio) || isNaN(fine)) {
                alert("Compila tutti i campi!"); return;
            }

            // SALVATAGGIO DATI
            localStorage.setItem('pagaGiorno', pagaG);
            localStorage.setItem('dataInizio', document.getElementById('dataInizio').value);
            localStorage.setItem('dataFine', document.getElementById('dataFine').value);

            // Calcolo giorni totali e paga totale prevista
            const diffTempo = Math.abs(fine - inizio);
            const diffGiorni = diffTempo / (1000 * 60 * 60 * 24);
            const pagaTotalePrevista = pagaG * diffGiorni;
            const pagaAlSecondo = pagaTotalePrevista / (diffTempo / 1000);

            document.getElementById('setup').style.display = 'none';
            document.getElementById('counter').style.display = 'block';
            
            document.getElementById('summary').innerHTML = `
                <b>Periodo:</b> ${diffGiorni.toFixed(2)} giorni<br>
                <b>Paga Totale prevista:</b> €${pagaTotalePrevista.toFixed(2)}<br>
                <b>Al minuto:</b> €${(pagaAlSecondo * 60).toFixed(4)}
            `;

            setInterval(() => {
                const adesso = new Date();
                let secondiTrascorsi = (adesso - inizio) / 1000;

                if (secondiTrascorsi < 0) secondiTrascorsi = 0;
                if (adesso > fine) secondiTrascorsi = diffTempo / 1000;

                const guadagnoAttuale = secondiTrascorsi * pagaAlSecondo;
                document.getElementById('display').innerText = "€ " + guadagnoAttuale.toLocaleString('it-IT', {minimumFractionDigits: 4, maximumFractionDigits: 4});
            }, 1000);
        }

        function clearData() {
            if(confirm("Vuoi cancellare i dati salvati?")) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>
</html>
