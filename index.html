<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Live Earnings Pro</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 2rem; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h1 { color: #2c3e50; font-size: 2.8rem; margin: 10px 0; font-variant-numeric: tabular-nums; }
        label { display: block; text-align: left; font-size: 0.85rem; font-weight: 600; color: #444; margin-top: 15px; }
        input { width: 100%; padding: 14px; margin: 5px 0; border: 2px solid #eee; border-radius: 12px; box-sizing: border-box; font-size: 1rem; }
        button { background: #2ecc71; color: white; border: none; padding: 16px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; font-size: 1.1rem; margin-top: 10px; }
        
        .progress-container { width: 100%; background-color: #eee; border-radius: 10px; margin: 10px 0; height: 24px; overflow: hidden; border: 1px solid #ddd; }
        .progress-bar { height: 100%; width: 0%; transition: width 1s linear, background-color 1s linear; }
        
        .date-info { font-size: 0.85rem; color: #7f8c8d; margin-top: 10px; font-weight: 500; }
        .percent-text { font-size: 1rem; font-weight: bold; margin-bottom: 2px; }

        .edit-btn { background: #3498db; margin-top: 10px; font-size: 0.9rem; }
        .reset-btn { background: #95a5a6; margin-top: 20px; font-size: 0.8rem; opacity: 0.7; }
        .info-box { background: #f8f9fa; padding: 15px; border-radius: 12px; margin-top: 15px; text-align: left; font-size: 0.85rem; line-height: 1.6; color: #2c3e50; }
        .hidden { display: none; }
        .licenza-label { color: #e67e22; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card" id="setup">
        <h2 style="margin:0">Configurazione</h2>
        <label>Paga Giornaliera (€)</label>
        <input type="number" id="pagaGiorno" placeholder="Es: 120">
        <label>Inizio Periodo</label>
        <input type="datetime-local" id="dataInizio">
        <label>Fine Periodo</label>
        <input type="datetime-local" id="dataFine">
        <button onclick="startCounter()">Avvia Conteggio</button>
    </div>

    <div class="card hidden" id="counter">
        <div style="color:#7f8c8d; font-weight: 600; font-size: 0.9rem;">Guadagno in tempo reale:</div>
        <h1 id="display">€ 0,0000</h1>
        
        <div class="date-info" id="endDateDisplay"></div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="percent-text" id="percentValue">0%</div>

        <div class="info-box" id="summary"></div>

        <div id="editZone" class="hidden">
            <label>Nuova Data di Fine</label>
            <input type="datetime-local" id="nuovaFine">
            <button onclick="updateEndDate()">Conferma Modifica</button>
        </div>
        
        <button id="toggleEdit" class="edit-btn" onclick="showEdit()">Modifica Data Fine</button>
        <button class="reset-btn" onclick="clearData()">Reset Totale</button>
    </div>

    <script>
        let interval;

        window.onload = () => {
            if(localStorage.getItem('pagaGiorno')) {
                document.getElementById('pagaGiorno').value = localStorage.getItem('pagaGiorno');
                document.getElementById('dataInizio').value = localStorage.getItem('dataInizio');
                document.getElementById('dataFine').value = localStorage.getItem('dataFine');
                startCounter();
            }
        };

        function getProgressColor(percent) {
            const r = percent < 50 ? 231 : Math.floor(231 - (percent - 50) * 4.62);
            const g = percent < 50 ? Math.floor(percent * 4.62) : 231;
            return `rgb(${r}, ${g}, 60)`;
        }

        function contaDomeniche(inizio, fine) {
            let conteggio = 0;
            let dataCorrente = new Date(inizio);
            // Portiamo la data all'inizio del giorno per il confronto
            dataCorrente.setHours(0, 0, 0, 0);
            let dataFineConf = new Date(fine);
            
            while (dataCorrente <= dataFineConf) {
                if (dataCorrente.getDay() === 0) { // 0 è Domenica
                    conteggio++;
                }
                dataCorrente.setDate(dataCorrente.getDate() + 1);
            }
            return conteggio;
        }

        function startCounter() {
            const pagaG = parseFloat(document.getElementById('pagaGiorno').value);
            const inizio = new Date(document.getElementById('dataInizio').value);
            const fine = new Date(document.getElementById('dataFine').value);
            if (!pagaG || isNaN(inizio) || isNaN(fine)) return;

            localStorage.setItem('pagaGiorno', pagaG);
            localStorage.setItem('dataInizio', document.getElementById('dataInizio').value);
            localStorage.setItem('dataFine', document.getElementById('dataFine').value);
            renderUI(pagaG, inizio, fine);
        }

        function renderUI(pagaG, inizio, fine) {
            if(interval) clearInterval(interval);
            const diffTempoTotale = fine - inizio;
            const diffGiorni = diffTempoTotale / (1000 * 60 * 60 * 24);
            const pagaTotale = pagaG * diffGiorni;
            const pagaAlSecondo = pagaTotale / (diffTempoTotale / 1000);
            
            const numDomeniche = contaDomeniche(inizio, fine);

            document.getElementById('setup').classList.add('hidden');
            document.getElementById('counter').classList.remove('hidden');
            
            // Mostra la data di fine
            document.getElementById('endDateDisplay').innerText = "Fine impostata: " + fine.toLocaleString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });

            document.getElementById('summary').innerHTML = `
                <b>Paga Totale prevista:</b> €${pagaTotale.toFixed(2)}<br>
                <span class="licenza-label">Licenza maturata:</span> ${numDomeniche} ${numDomeniche === 1 ? 'domenica' : 'domeniche'}
            `;

            interval = setInterval(() => {
                const adesso = new Date();
                let secondiTrascorsi = (adesso - inizio) / 1000;
                let durataTotaleSecondi = diffTempoTotale / 1000;

                if (secondiTrascorsi < 0) secondiTrascorsi = 0;
                if (adesso > fine) secondiTrascorsi = durataTotaleSecondi;

                const guadagnoAttuale = secondiTrascorsi * pagaAlSecondo;
                document.getElementById('display').innerText = "€ " + guadagnoAttuale.toLocaleString('it-IT', {minimumFractionDigits: 4});

                const percentuale = (secondiTrascorsi / durataTotaleSecondi) * 100;
                const color = getProgressColor(percentuale);
                
                const bar = document.getElementById('progressBar');
                bar.style.width = percentuale.toFixed(2) + "%";
                bar.style.backgroundColor = color;
                
                const txt = document.getElementById('percentValue');
                txt.innerText = percentuale.toFixed(1) + "%";
                txt.style.color = color;

            }, 1000);
        }

        function showEdit() {
            document.getElementById('editZone').classList.toggle('hidden');
            document.getElementById('toggleEdit').innerText = document.getElementById('editZone').classList.contains('hidden') ? "Modifica Data Fine" : "Annulla";
        }

        function updateEndDate() {
            const nuovaFineVal = document.getElementById('nuovaFine').value;
            if(!nuovaFineVal) return alert("Seleziona una nuova data!");
            document.getElementById('dataFine').value = nuovaFineVal;
            localStorage.setItem('dataFine', nuovaFineVal);
            startCounter();
            showEdit();
        }

        function clearData() { if(confirm("Resettare tutto?")) { localStorage.clear(); location.reload(); } }
    </script>
</body>
</html>
