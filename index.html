<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gioco del Caffè - Pro Edition</title>
    <style>
        :root { --bg-color: #2e7d32; }
        body {
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            transition: background-color 0.5s ease;
            color: white;
            overflow: hidden;
        }
        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            width: 90%;
            max-width: 450px;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .range-display {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 1.5rem 0;
        }
        input {
            padding: 12px;
            width: 80%;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        button {
            padding: 12px 25px;
            background-color: white;
            color: #333;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }
        .hidden { display: none; }
        #message {
            margin-top: 1rem;
            font-size: 1.4rem;
            font-weight: bold;
            min-height: 1.6em;
            text-transform: uppercase;
        }
        .paga { color: #ffeb3b; font-size: 2.5rem; animation: shake 0.3s infinite; display:block; }
        @keyframes shake {
            0% { transform: translate(1px, 1px); }
            50% { transform: translate(-2px, -1px); }
            100% { transform: translate(1px, 1px); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>☕ Coffee Game</h1>

    <div id="setup">
        <p>Imposta l'intervallo:</p>
        <input type="number" id="minInput" value="1">
        <input type="number" id="maxInput" value="1000">
        <br>
        <button onclick="startGame()">Inizia Sfida</button>
    </div>

    <div id="game" class="hidden">
        <p>Scegli tra (estremi esclusi):</p>
        <div class="range-display">
            <span id="currentMin"></span> <small>...</small <span id="currentMax"></span>
        </div>
        <input type="number" id="guessInput" placeholder="Tocca a te">
        <br>
        <button onclick="makeGuess()">Conferma</button>
        <p id="message"></p>
        <button id="resetBtn" class="hidden" onclick="location.reload()">Ricomincia</button>
    </div>
</div>

<script>
    let targetNumber, min, max, initialRange;

    function startGame() {
        min = parseInt(document.getElementById('minInput').value);
        max = parseInt(document.getElementById('maxInput').value);

        if (isNaN(min) || isNaN(max) || (max - min) < 2) {
            alert("Intervallo troppo piccolo! Deve esserci almeno un numero nel mezzo.");
            return;
        }

        // Il target NON può essere né min né max
        targetNumber = Math.floor(Math.random() * (max - min - 1)) + (min + 1);
        initialRange = max - min;

        updateUI();
        document.getElementById('setup').classList.add('hidden');
        document.getElementById('game').classList.remove('hidden');
    }

    function makeGuess() {
        const input = document.getElementById('guessInput');
        const guess = parseInt(input.value);
        const msg = document.getElementById('message');

        // Controllo validità (non si possono scegliere gli estremi)
        if (isNaN(guess) || guess <= min || guess >= max) {
            msg.innerText = `Scegli tra ${min+1} e ${max-1}!`;
            return;
        }

        if (guess === targetNumber) {
            msg.innerHTML = "<span class='paga'>Paga, CIUCCCC! ☕</span>";
            document.body.style.backgroundColor = "#b71c1c";
            document.getElementById('resetBtn').classList.remove('hidden');
            input.disabled = true;
        } else {
            let specialMsg = "";
            
            // Regola dello 0 finale
            if (guess % 10 === 0) {
                specialMsg = "Lo 0 non paga mai! 😎";
            }

            // Aggiorna intervallo
            if (guess < targetNumber) {
                min = guess;
            } else {
                max = guess;
            }

            // Regola dell'INFAME (se resta solo un numero possibile tra min e max)
            if (max - min === 2) {
                specialMsg = "⚠️ INFAME! ⚠️";
            }

            msg.innerText = specialMsg || "Salvo!";
            updateUI();
            updateColor();
            input.value = "";
            input.focus();
        }
    }

    function updateUI() {
        document.getElementById('currentMin').innerText = min;
        document.getElementById('currentMax').innerText = max;
    }

    function updateColor() {
        const currentRange = max - min;
        const tension = 1 - (currentRange / initialRange);
        const hue = Math.floor(120 - (tension * 120));
        document.body.style.backgroundColor = `hsl(${hue}, 60%, 40%)`;
    }

    document.getElementById('guessInput').addEventListener("keyup", e => {
        if (e.key === "Enter") makeGuess();
    });
</script>

</body>
</html>
